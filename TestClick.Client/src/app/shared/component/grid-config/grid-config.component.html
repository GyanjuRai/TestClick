<section class="grid">
  <!-- GRID HEADER -->
  <div class="grid-header">
    <div class="grid-col" *ngFor="let col of gridConfig.columns">
      {{ col.columnName }}
    </div>
  </div>

  @if (totalRows > 0) {
    <!-- ROWS -->
    <div class="grid-row" *ngFor="let data of gridConfig.dataSource.data">
      <div
        class="grid-col"
        (dblclick)="doubleClickRow(data)"
        *ngFor="let col of columns"
      >
        <div class="grid-data-wrapper">
          <span class="grid-data">{{ data[col] || "!" }}</span>
        </div>
      </div>
      <div class="btn-container">
        <button
          type="button"
          class="btn-update"
          title="Update"
          (click)="updateRow(data)"
        >
          <span class="btn-icon">
            <fa-icon [icon]="faPen"></fa-icon>
          </span>
        </button>

        <button
          type="button"
          class="btn-delete"
          title="Delete"
          (click)="deleteRow(data.id ?? 0)"
        >
          <span class="btn-icon">
            <fa-icon [icon]="faTrash"></fa-icon>
          </span>
        </button>
      </div>
    </div>
  } @else {
    <div class="gird-row" *ngIf="gridConfig.dataSource.data.length === 0">
      <div class="grid-col">
        <div class="grid-data-wrapper" style="text-align: center !important">
          <span class="grid-data">No Data found</span>
        </div>
      </div>
    </div>
  }

  <!-- PAGINATION -->
  <div class="grid-pagination">
    <span class="pagination-info"
      >Showing {{ showingFrom }} - {{ showingTo }} of {{ totalRows }}</span
    >
    <div class="pagination-controls">
      <button
        class="page-btn"
        [class.disabled]="currentPage === 1"
        [disabled]="currentPage === 1"
        (click)="changePage(currentPage - 1)"
      >
        Prev
      </button>

      <button
        type="button"
        class="page-btn"
        [class.active]="page === currentPage"
        [disabled]="page === currentPage"
        *ngFor="let page of pageList"
        (click)="changePage(page)"
      >
        {{ page }}
      </button>

      <button
        class="page-btn"
        [class.disabled]="currentPage === totalPage"
        [disabled]="currentPage === totalPage"
        (click)="changePage(currentPage + 1)"
      >
        Next
      </button>
    </div>
  </div>
</section>
