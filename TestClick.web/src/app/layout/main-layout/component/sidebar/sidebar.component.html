<p-sidebar
  class="sidebar"
  #sidebarRef
  [visible]="(sideBarVisible | async) ?? false"
  [modal]="false"
>
  <ng-template pTemplate="headless">
    <div class="flex flex-column h-full">
      <div
        class="flex align-items-center justify-content-between px-4 pt-3 flex-shrink-0"
      >
        <span class="inline-flex align-items-center gap-2">
          <p-avatar
            image="../../.././assets/logo/dooh_logo.png"
            shape="circle"
            size="large"
          ></p-avatar>
        </span>
        <span class="font-semibold text-2xl text-primary mr-2">DOOHClick</span>
      </div>

      <div class="overflow-y-auto">
        <ul class="list-none p-3 m-0">
          <li>
            <div
              pRipple
              pStyleClass="@next"
              enterFromClass="hidden"
              enterActiveClass="slidedown"
              leaveToClass="hidden"
              leaveActiveClass="slideup"
              class="p-3 flex align-items-center justify-content-between text-600 cursor-pointer p-ripple"
            >
              <span class="font-medium">Inventory</span>
              <i class="pi pi-chevron-down"></i>
            </div>
            <ul class="list-none p-0 m-0 overflow-hidden">
              <li
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <a
                  pRipple
                  [routerLink]="[
                    '/',
                    routes.INVENTORY,
                    routes.INVENTORY_SCREEN,
                  ]"
                  class="flex align-items-center cursor-pointer p-3 border-round text-700 no-underline hover:surface-100 transition-duration-150 transition-colors p-ripple"
                >
                  <i class="pi pi-desktop mr-2"></i>
                  <span class="font-medium">Screen</span>
                </a>
              </li>
              <!-- <li>
                <a pRipple class="flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors p-ripple">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="8 6 64 48"
                    width="1.5rem"
                    height="1.5rem"
                    fill="currentColor"
                    style="display:block; flex-shrink:0;"
                  >
                    <g transform="translate(10,10)">
                      <rect x="0" y="18" width="30" height="22" rx="2" />
                      <rect x="12" y="40" width="6" height="5" />
                      <rect x="8" y="45" width="14" height="2" rx="1" />
                      <rect x="50" y="18" width="30" height="22" rx="2" />
                      <rect x="62" y="40" width="6" height="5" />
                      <rect x="58" y="45" width="14" height="2" rx="1" />
                      <rect x="17" y="8" width="46" height="34" rx="2.5" />
                      <rect x="36" y="42" width="8" height="7" />
                      <rect x="30" y="49" width="20" height="3" rx="1.5" />
                    </g>
                  </svg>
                  <span class="font-medium ml-2">Screen Group</span>
                </a>
              </li> -->

              <li>
                <a
                  pRipple
                  class="flex align-items-center cursor-pointer p-3 border-round text-700 no-underline hover:surface-100 transition-duration-150 transition-colors p-ripple"
                >
                  <i class="pi pi-play-circle mr-2"></i>
                  <span class="font-medium">Player</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
      <div class="mt-auto">
        <hr class="mb-3 mx-3 border-top-1 border-none surface-border" />
        <a
          pRipple
          class="m-3 flex align-items-center cursor-pointer p-3 gap-2 border-round text-700 hover:surface-100 transition-duration-150 transition-colors p-ripple"
        >
          <p-avatar
            image="https://i.pinimg.com/474x/bc/69/93/bc69933028de5d19088fe00d5e9aa936.jpg"
            shape="circle"
          />
          <span class="font-bold">Junior dev</span>
        </a>
      </div>
    </div>
  </ng-template>
</p-sidebar>
